# Service Discovery & Internal Networking Contract

services:
  app:
    internal_alias: app
    external_port: 8000
    protocol: http
    health_check:
      path: /up
      expected_status: 200

  web:
    internal_alias: web
    external_port: 5173
    protocol: http
    hmr_port: 5173

  db:
    internal_alias: db
    external_port: 5432
    protocol: postgresql
    ready_signal: "database system is ready to accept connections"

  redis:
    internal_alias: redis
    external_port: 6379
    protocol: redis

  mail:
    internal_alias: mail
    external_port: 8025
    protocol: http
    smtp_port: 1025
